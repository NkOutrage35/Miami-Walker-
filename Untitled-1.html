<!-- Sign-In overlay -->
    <div
      class="fixed inset-0 backdrop-blur bg-opacity-50 flex items-center justify-center transition-opacity duration-300 opacity-0 pointer-events-none z-50"
      id="login-modal"
    >
      <div
        class="bg-white p-8 rounded-lg shadow-2xl relative w-full max-w-md transform transition-all duration-300 scale-95"
      >
        <button 
          class="close-btn absolute top-3 right-3 text-gray-500 hover:text-gray-900 transition-colors"
          id="close-modal-btn"
        >
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>

        <h1
          id="sign-in-title"
          class="text-3xl font-bold mb-6 text-center text-gray-800"
        >
          Sign In
        </h1>

        <form
          action="https://api.web3forms.com/submit"
          method="post"
          id="login-form"
        >
          <!-- EMAIL FIELD -->
          <div class="input_control mb-4 email-control">
            <label for="email" class="hidden">Email</label>
            <div
              class="flex items-center border border-gray-300 rounded-md focus-within:ring-2 focus-within:ring-blue-500"
            >
              <i class="fa-solid fa-envelope text-gray-400 px-3"></i>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Email"
                required
                class="w-full py-2 px-3 border-none focus:outline-none rounded-r-md"
              />
            </div>
            <div class="error-message text-sm text-red-500 mt-1 h-4"></div>
          </div>

          <!-- PASSWORD FIELD -->
          <div class="input_control password_field mb-6 password-control">
            <label for="password" class="hidden">Password</label>
            <div
              class="flex items-center border border-gray-300 rounded-md focus-within:ring-2 focus-within:ring-blue-500"
            >
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required
                class="w-full py-2 px-3 border-none focus:outline-none rounded-l-md"
              />
              <i
                class="fa-regular fa-eye text-gray-400 pr-8 cursor-pointer hover:text-gray-600 transition-colors"
                id="togglePassword"
              ></i>
            </div>
            <div class="error-message text-sm text-red-500 mt-1 h-4"></div>
          </div>

          <p id="forgot-password" class="text-sm text-gray-600 mb-6">
            Lost your password?
            <a
              href="sign-up.html"
              class="text-blue-600 hover:text-blue-800 font-medium"
              >Click here</a
            >
          </p>

          <button
            class="w-full py-3 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition-colors duration-200 focus:outline-none focus:ring-4 focus:ring-blue-300"
            type="submit"
            id="sign-in-btn"
          >
            Sign In
          </button>
        </form>
      </div>
    </div>
    <script>
      // Get modal and close button
      const loginModal = document.getElementById("login-modal");
      const closeModalBtn = document.getElementById("close-modal-btn");

      function openLoginModal() {
        loginModal.classList.remove("opacity-0", "pointer-events-none");
        loginModal.classList.add("opacity-100", "pointer-events-auto");
      }

      function closeLoginModal() {
        loginModal.classList.add("opacity-0", "pointer-events-none");
        loginModal.classList.remove("opacity-100", "pointer-events-auto");
      }

      closeModalBtn.addEventListener("click", closeLoginModal);

      // Open login modal if URL has showLogin=true
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("showLogin") === "true") {
        openLoginModal();
      }

      // Optional: close modal when clicking outside
      loginModal.addEventListener("click", (e) => {
        if (e.target === loginModal) closeLoginModal();
      });
    </script>
